services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sena_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-biblioteca_db}
    ports:
      - "5437:5432"
    volumes:
      - postgres_data_v3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sena_user} -d ${POSTGRES_DB:-biblioteca_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - coolify

  # Servicio único de aplicación: Flask sirve la API y el frontend React
  # ya compilado (multi-stage en ./Dockerfile). El puerto 5000 es el que
  # el proxy de Coolify debe apuntar como FQDN público.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sena_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-biblioteca_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # URL pública para enlaces e imágenes de los correos (plantilla de marca)
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://sena.newonline.digital}
    expose:
      - "5000"
    volumes:
      - uploads_data:/app/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/v1/health', timeout=5).status == 200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - coolify
    command: >
      sh -c "gunicorn --bind 0.0.0.0:5000 --workers 2 wsgi:app"

volumes:
  postgres_data_v3:
  uploads_data:

networks:
  coolify:
    external: true
