name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-postgres:
    name: Pytest (PostgreSQL 15)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sena_test
          POSTGRES_PASSWORD: sena_test
          POSTGRES_DB: biblioteca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sena_test -d biblioteca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Base exclusiva de pruebas: su nombre debe terminar en _test (tests/__init__.py lo exige).
      TEST_DATABASE_URL: postgresql://sena_test:sena_test@localhost:5432/biblioteca_test
      # La app exige estas claves para arrancar; aquí son valores de prueba, no reales.
      SECRET_KEY: clave-secreta-solo-para-pruebas-0123456789abcdef
      JWT_SECRET_KEY: jwt-clave-solo-para-pruebas-0123456789abcdef
      FLASK_ENV: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: python -m pytest --cov=app/models --cov-report=term

  dependencias:
    name: Vulnerabilidades en dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (Python)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/static/package-lock.json

      - name: npm audit (frontend)
        working-directory: app/static
        run: npm audit --omit=dev --audit-level=high
